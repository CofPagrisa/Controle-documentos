<style>:root{color-scheme:light;box-sizing:border-box}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#EAEEF3; --surface-3:#DEE4EB;
  --border:#D7DEE6; --text:#16202B; --text-muted:#5C6B7A; --text-faint:#8996A5;
  --accent:#0B6E63; --accent-ink:#FFFFFF; --accent-soft:#E1EFEC; --accent-strong:#075048;
  --ok:#2F9E44; --ok-soft:#E4F6E7; --ok-ink:#1B6E2C;
  --warn:#B9740C; --warn-soft:#FBEDD9; --warn-ink:#8A5806;
  --bad:#D8434B; --bad-soft:#FBE4E5; --bad-ink:#A62630;
  --info:#3568C6; --info-soft:#E5EDFB; --info-ink:#26499A;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 8px 24px -12px rgba(20,30,40,.22);
  --shadow-lg:0 12px 40px -12px rgba(20,30,40,.35);
  --radius:10px; --radius-sm:7px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1417; --surface:#171E23; --surface-2:#1E272D; --surface-3:#28333A;
    --border:#2C3941; --text:#E7EDF2; --text-muted:#98A8B4; --text-faint:#6E7E8A;
    --accent:#4FBBAA; --accent-ink:#04211D; --accent-soft:#17332C; --accent-strong:#7CD3C3;
    --ok:#5FC97F; --ok-soft:#12331B; --ok-ink:#8FDCA5;
    --warn:#E5A54B; --warn-soft:#3A2A0F; --warn-ink:#F0BD75;
    --bad:#F1707A; --bad-soft:#3B191C; --bad-ink:#F6A0A7;
    --info:#7DA6F0; --info-soft:#16223B; --info-ink:#AFC7F5;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px -12px rgba(0,0,0,.7);
    --shadow-lg:0 16px 48px -12px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1417; --surface:#171E23; --surface-2:#1E272D; --surface-3:#28333A;
  --border:#2C3941; --text:#E7EDF2; --text-muted:#98A8B4; --text-faint:#6E7E8A;
  --accent:#4FBBAA; --accent-ink:#04211D; --accent-soft:#17332C; --accent-strong:#7CD3C3;
  --ok:#5FC97F; --ok-soft:#12331B; --ok-ink:#8FDCA5;
  --warn:#E5A54B; --warn-soft:#3A2A0F; --warn-ink:#F0BD75;
  --bad:#F1707A; --bad-soft:#3B191C; --bad-ink:#F6A0A7;
  --info:#7DA6F0; --info-soft:#16223B; --info-ink:#AFC7F5;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px -12px rgba(0,0,0,.7);
  --shadow-lg:0 16px 48px -12px rgba(0,0,0,.75);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.45;}
h1,h2,h3,h4{font-family:'Manrope',system-ui,sans-serif;font-weight:800;letter-spacing:-.01em;text-wrap:balance;margin:0;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
.tnum{font-variant-numeric:tabular-nums;}
a{color:var(--accent);}
button{font-family:inherit;}
::-webkit-scrollbar{height:10px;width:10px;}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:8px;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* ---------- layout ---------- */
#app{min-height:100dvh;}
.shell{display:flex;min-height:100dvh;}
.sidebar{width:232px;flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 14px;gap:4px;position:sticky;top:0;height:100dvh;overflow-y:auto;}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-family:'Manrope';font-weight:800;font-size:16px;flex:none;}
.brand-name{font-family:'Manrope';font-weight:800;font-size:16px;}
.brand-sub{font-size:11px;color:var(--text-faint);}
.navlink{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);color:var(--text-muted);text-decoration:none;font-weight:600;font-size:13.5px;cursor:pointer;border:1px solid transparent;background:none;text-align:left;width:100%;}
.navlink:hover{background:var(--surface-2);color:var(--text);}
.navlink.active{background:var(--accent-soft);color:var(--accent-strong);}
.navlink .ic{width:18px;text-align:center;flex:none;}
.nav-spacer{flex:1;}
.side-foot{border-top:1px solid var(--border);padding-top:10px;margin-top:8px;}
.userchip{display:flex;align-items:center;gap:9px;padding:8px;border-radius:var(--radius-sm);}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none;}
.uname{font-weight:700;font-size:13px;}
.urole{font-size:11px;color:var(--text-faint);text-transform:capitalize;}
.switchuser{font-size:11.5px;color:var(--text-faint);background:none;border:none;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:5;flex-wrap:wrap;}
.hamburger{display:none;background:none;border:1px solid var(--border);border-radius:8px;width:36px;height:36px;color:var(--text);cursor:pointer;font-size:16px;}
.topbar h1{font-size:19px;}
.topbar-sub{color:var(--text-faint);font-size:12.5px;}
.yearpicker{margin-left:auto;display:flex;align-items:center;gap:8px;}
.content{padding:22px;max-width:1400px;width:100%;margin:0 auto;flex:1;}

@media (max-width:880px){
  .sidebar{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);transition:transform .18s ease;z-index:40;box-shadow:var(--shadow-lg);}
  .sidebar.open{transform:translateX(0);}
  .hamburger{display:flex;align-items:center;justify-content:center;}
  .scrim{display:none;position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:35;}
  .scrim.open{display:block;}
  .content{padding:14px;}
  .topbar{padding:10px 14px;}
}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;}
.btn:hover{background:var(--surface-2);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);}
.btn-danger{color:var(--bad);border-color:var(--bad);}
.btn-danger:hover{background:var(--bad-soft);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}
.iconbtn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;color:var(--text-muted);}
.iconbtn:hover{background:var(--surface-2);color:var(--text);}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.card-pad{padding:18px;}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.section-head h2{font-size:17px;}
.muted{color:var(--text-muted);}
.faint{color:var(--text-faint);font-size:12px;}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);}
.kpi-label{font-size:11.5px;color:var(--text-faint);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.kpi-value{font-family:'Manrope';font-weight:800;font-size:26px;margin-top:4px;}
.kpi.ok .kpi-value{color:var(--ok);} .kpi.warn .kpi-value{color:var(--warn);} .kpi.bad .kpi-value{color:var(--bad);} .kpi.info .kpi-value{color:var(--info);}
.kpi.clickable{cursor:pointer;transition:box-shadow .12s,border-color .12s;}
.kpi.clickable:hover{border-color:var(--accent);box-shadow:var(--shadow-lg);}
.kpi.clickable:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.chip.pago{background:var(--ok-soft);color:var(--ok-ink);}
.chip.avencer{background:var(--info-soft);color:var(--info-ink);}
.chip.proximo{background:var(--warn-soft);color:var(--warn-ink);}
.chip.vencido{background:var(--bad-soft);color:var(--bad-ink);}
.chip.role{background:var(--surface-3);color:var(--text-muted);}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none;}

.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);}
table{border-collapse:collapse;width:100%;min-width:760px;}
th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--surface-2);}
tbody tr.clickable{cursor:pointer;}
.empty-row td{white-space:normal;text-align:center;color:var(--text-faint);padding:30px 12px;}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.field{display:flex;flex-direction:column;gap:4px;}
.field label{font-size:11px;color:var(--text-faint);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
input,select,textarea{font-family:inherit;font-size:13px;padding:8px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text);}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
textarea{resize:vertical;min-height:64px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-grid .full{grid-column:1/-1;}
@media (max-width:560px){.form-grid{grid-template-columns:1fr;}}

.badge-count{background:var(--surface-3);color:var(--text-muted);border-radius:99px;padding:1px 8px;font-size:11px;font-weight:700;}

/* ---------- modal / drawer ---------- */
.modal-scrim{position:fixed;inset:0;background:rgba(10,15,20,.5);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto;z-index:100;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;padding:22px;}
.modal.wide{max-width:820px;}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:16px;}
.modal-head h3{font-size:17px;}
.modal-close{background:none;border:none;font-size:20px;color:var(--text-faint);cursor:pointer;line-height:1;padding:2px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
.toast-wrap{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:200;}
.toast{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);}
.toast.err{background:var(--bad);color:#fff;}

.login-wrap{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);padding:28px;}
.userpick{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);cursor:pointer;margin-bottom:8px;text-align:left;}
.userpick:hover{border-color:var(--accent);background:var(--accent-soft);}

.timeline{display:flex;flex-direction:column;gap:0;}
.tl-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
.tl-item:last-child{border-bottom:none;}
.tl-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:5px;flex:none;}

.yearline{display:flex;align-items:center;gap:8px;padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;flex-wrap:wrap;}
.taglink{color:var(--accent);text-decoration:none;font-weight:600;font-size:12.5px;}

.dropzone{border:1.5px dashed var(--border);border-radius:var(--radius-sm);padding:16px;text-align:center;color:var(--text-faint);font-size:12.5px;cursor:pointer;}
.dropzone:hover{border-color:var(--accent);color:var(--accent);}

.tab-row{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--border);}
.tab-btn{background:none;border:none;padding:9px 4px;margin-right:14px;font-weight:700;font-size:13px;color:var(--text-faint);cursor:pointer;border-bottom:2px solid transparent;}
.tab-btn.active{color:var(--accent-strong);border-color:var(--accent);}

[hidden]{display:none!important;}
</style>

<script>
"use strict";
// ==== Config do Firebase: cole aqui o bloco firebaseConfig do Console (Configurações do projeto > Seus apps) ====
const firebaseConfig = {
  apiKey: "AIzaSyDyIB-pMHHMOKTnsndZIJesKk3Z5VGXpsk",
  authDomain: "controle-documentos-411b4.firebaseapp.com",
  projectId: "controle-documentos-411b4",
  storageBucket: "controle-documentos-411b4.firebasestorage.app",
  messagingSenderId: "525348693563",
  appId: "1:525348693563:web:a825a7194667da3f081e1e",
};
firebase.initializeApp(firebaseConfig);
const _fsdb = firebase.firestore();
let _authReadyPromise = null;
function _ensureAuth(){
  if(!_authReadyPromise){
    _authReadyPromise = new Promise(resolve=>{
      const unsub = firebase.auth().onAuthStateChanged(user=>{
        if(user){ unsub(); resolve(); }
      });
      firebase.auth().signInAnonymously().catch(err=>console.error("Falha no login anônimo do Firebase:",err));
    });
  }
  return _authReadyPromise;
}
window.claude = window.claude || {};
window.claude.use = async function(which){
  if(which==="db"){ await _ensureAuth(); return _fsdb; }
  return null; // "downloads": o app já cai no download direto pelo navegador
};

<script>
"use strict";

/* ============================== UTIL ============================== */
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function todayISO(){const d=new Date();const tz=d.getTimezoneOffset()*60000;return new Date(d-tz).toISOString().slice(0,10);}
function nowISO(){return new Date().toISOString();}
function diffDays(a,b){const da=new Date(a+"T00:00:00"),db_=new Date(b+"T00:00:00");return Math.round((da-db_)/86400000);}
function formatDateBR(iso){if(!iso)return "–";const p=iso.split("-");return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:iso;}
function formatDateTimeBR(iso){if(!iso)return "–";const d=new Date(iso);if(isNaN(d))return "–";return d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});}
function formatMoney(v){if(v===null||v===undefined||v==="")return "–";return Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});}
function normalizePlaca(p){return String(p||"").toUpperCase().replace(/[^0-9A-Z]/g,"");}
function lastDigit(placa){const s=normalizePlaca(placa);for(let i=s.length-1;i>=0;i--){if(/[0-9]/.test(s[i]))return s[i];}return null;}
const TENS_GRUPOS=[{key:"a",label:"0–3",min:0,max:3},{key:"b",label:"4–6",min:4,max:6},{key:"c",label:"7–9",min:7,max:9}];
function placaBucket(placa){
  const s=normalizePlaca(placa);
  if(s.length<2)return null;
  const digitoFinal=s[s.length-1], digitoDezena=s[s.length-2];
  if(!/[0-9]/.test(digitoFinal)||!/[0-9]/.test(digitoDezena))return null;
  const dz=Number(digitoDezena);
  const grupo=TENS_GRUPOS.find(g=>dz>=g.min&&dz<=g.max);
  return grupo?{digito:digitoFinal,grupo:grupo.key}:null;
}
function regraKey(digito,grupo){ return digito+"_"+grupo; }
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);}
function debounce(fn,ms){let t;return (...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}
function currentYear(){return new Date().getFullYear();}

const STATUS_META={
  pago:{label:"Pago",cls:"pago"},
  avencer:{label:"A vencer",cls:"avencer"},
  proximo:{label:"Próximo do vencimento",cls:"proximo"},
  vencido:{label:"Vencido",cls:"vencido"},
};
function computeStatus(vencimento,pagamento){
  if(pagamento&&pagamento.data)return "pago";
  if(!vencimento)return "avencer";
  const dias=diffDays(vencimento,todayISO());
  if(dias<0)return "vencido";
  if(dias<=30)return "proximo";
  return "avencer";
}
function diasLabel(vencimento,status){
  if(status==="pago")return "–";
  if(!vencimento)return "–";
  const dias=diffDays(vencimento,todayISO());
  if(dias<0)return `Vencido há ${Math.abs(dias)}d`;
  if(dias===0)return "Vence hoje";
  return `${dias}d`;
}

/* ============================== STATE ============================== */
const state={
  db:null,
  dbReady:false,
  user:null,
  route:"dashboard",
  ano:currentYear(),
  veiculos:new Map(),
  tabelas:new Map(),
  controles:new Map(),
  usuarios:new Map(),
  auditoria:[],
  loadedVeiculos:false,
  loadedTabelas:false,
  loadedUsuarios:false,
  loadedControles:false,
  sidebarOpen:false,
  modal:null,
  filters:{placa:"",frota:"",setor:"",status:"",mes:"",de:"",ate:""},
  unsubControles:null,
  unsubAuditoria:null,
  detailCache:new Map(),
};

try{const u=localStorage.getItem("fed_user");if(u)state.user=JSON.parse(u);}catch(e){}

/* ============================== TOAST ============================== */
function toast(msg,isErr){
  const root=document.getElementById("toast-root");
  const el=document.createElement("div");
  el.className="toast"+(isErr?" err":"");
  el.textContent=msg;
  root.appendChild(el);
  setTimeout(()=>{el.style.opacity="0";el.style.transition="opacity .3s";setTimeout(()=>el.remove(),300);},3200);
}

/* ============================== DB LAYER ============================== */
async function initDb(){
  let db=null;
  try{ if(window.claude && window.claude.use) db=await window.claude.use("db"); }catch(e){}
  state.db=db;
  if(!db){ state.dbReady=false; render(); return; }
  state.dbReady=true;

  db.collection("veiculos").onSnapshot(snap=>{
    const m=new Map();
    snap.docs.forEach(d=>m.set(d.id,d.data()));
    state.veiculos=m; state.loadedVeiculos=true; render();
  },err=>toast("Erro ao carregar frota: "+err.message,true));

  db.collection("tabelasVencimento").onSnapshot(snap=>{
    const m=new Map();
    snap.docs.forEach(d=>m.set(d.id,d.data()));
    state.tabelas=m; state.loadedTabelas=true; render();
  },err=>toast("Erro ao carregar tabelas: "+err.message,true));

  db.collection("usuarios").onSnapshot(snap=>{
    const m=new Map();
    snap.docs.forEach(d=>m.set(d.id,d.data()));
    state.usuarios=m; state.loadedUsuarios=true;
    if(state.user){
      const fresh=m.get(state.user.id);
      if(fresh){ state.user={...state.user,nome:fresh.nome,papel:fresh.papel,ativo:fresh.ativo}; saveUserLocal(); }
      else if(m.size>0){ state.user=null; localStorage.removeItem("fed_user"); }
    }
    render();
  },err=>toast("Erro ao carregar usuários: "+err.message,true));

  subscribeControlesAno(state.ano);

async function gerarControlesParaAno(ano){
  ano=String(ano);
  const tabela=state.tabelas.get(ano);
  if(!tabela||!tabela.regras)return {criados:0,atualizados:0,protegidos:0};
  const byKey={};
  tabela.regras.forEach(r=>{ if(r.data) byKey[regraKey(r.digito,r.grupo)]=r.data; });
  let existentes=new Map();
  try{
    const snap=await state.db.collection("controles").where("ano","==",Number(ano)).get();
    snap.docs.forEach(d=>existentes.set(d.id,d.data()));
  }catch(e){}
  const ativos=[...state.veiculos.values()].filter(v=>v.situacao==="Ativo"&&v.licenciamentoAtivo!==false);
  let criados=0,atualizados=0,protegidos=0;
  for(const v of ativos){
    const bucket=placaBucket(v.placa);
    const venc=bucket?byKey[regraKey(bucket.digito,bucket.grupo)]:null;
    if(!venc)continue;
    const id=v.placa+"_"+ano;
    const atual=existentes.get(id);
    if(atual&&atual.origemVencimento==="importado"){ protegidos++; continue; }
    const body={
      placa:v.placa,frota:v.frota,ano:Number(ano),vencimento:venc,
      origemVencimento:"regra",
      pagamento:atual&&atual.pagamento?atual.pagamento:null,
      documento:atual&&atual.documento?atual.documento:null,
      comprovante:atual&&atual.comprovante?atual.comprovante:null,
      observacao:atual&&atual.observacao?atual.observacao:"",
      criadoEm:atual&&atual.criadoEm?atual.criadoEm:nowISO(),
      atualizadoEm:nowISO(),
    };
    await state.db.doc("controles/"+id).set(body);
    if(atual)atualizados++; else criados++;
  }
  return {criados,atualizados,protegidos};
}

async function gerarControlesParaVeiculo(v){
  if(v.situacao!=="Ativo"||v.licenciamentoAtivo===false)return;
  for(const ano of state.tabelas.keys()){
    const tabela=state.tabelas.get(ano);
    if(!tabela||!tabela.regras)continue;
    const bucket=placaBucket(v.placa);
    if(!bucket)continue;
    const venc=tabela.regras.find(r=>r.digito===bucket.digito&&r.grupo===bucket.grupo)?.data;
    if(!venc)continue;
    const id=v.placa+"_"+ano;
    let atual=null;
    try{ const snap=await state.db.doc("controles/"+id).get(); if(snap.exists) atual=snap.data(); }catch(e){}
    if(atual&&atual.origemVencimento==="importado")continue;
    await state.db.doc("controles/"+id).set({
      placa:v.placa,frota:v.frota,ano:Number(ano),vencimento:venc,
      origemVencimento:"regra",
      pagamento:atual&&atual.pagamento?atual.pagamento:null,
      documento:atual&&atual.documento?atual.documento:null,
      comprovante:atual&&atual.comprovante?atual.comprovante:null,
      observacao:atual&&atual.observacao?atual.observacao:"",
      criadoEm:atual&&atual.criadoEm?atual.criadoEm:nowISO(),
      atualizadoEm:nowISO(),
    });
  }
}

/* ============================== IMAGE COMPRESS ============================== */
function fileToCompressedDataUri(file){
  return new Promise((resolve,reject)=>{
    if(!file.type.startsWith("image/")){ reject(new Error("Selecione uma imagem (JPG/PNG). Para PDF, use o campo de link.")); return; }
    const img=new Image();
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error("Falha ao ler arquivo."));
    reader.onload=()=>{
      img.onload=()=>{
        let w=img.width,h=img.height;
        const maxDim=1100;
        if(w>maxDim||h>maxDim){ const s=maxDim/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
        const canvas=document.createElement("canvas");
        canvas.width=w; canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        let q=0.82, uriOut=canvas.toDataURL("image/jpeg",q);
        while(uriOut.length>150000 && q>0.35){ q-=0.12; uriOut=canvas.toDataURL("image/jpeg",q); }
        if(uriOut.length>190000){ reject(new Error("Imagem muito grande mesmo após compressão. Use uma foto menor ou cole um link.")); return; }
        resolve(uriOut);
      };
      img.onerror=()=>reject(new Error("Arquivo de imagem inválido."));
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function matchesFilters(row){
  const f=state.filters;
  if(f.placa && !row.placa.includes(normalizePlaca(f.placa))) return false;
  if(f.frota && !(row.frota||"").toLowerCase().includes(f.frota.toLowerCase())) return false;
  if(f.setor && (row.veiculo.setor||"")!==f.setor) return false;
  const status=computeStatus(row.vencimento,row.pagamento);
  if(f.status==="pendente"){ if(status==="pago"||status==="vencido") return false; }
  else if(f.status && status!==f.status) return false;
  if(f.mes && row.vencimento && row.vencimento.slice(5,7)!==f.mes) return false;
  if(f.de && row.vencimento && row.vencimento<f.de) return false;
  if(f.ate && row.vencimento && row.vencimento>f.ate) return false;
  return true;
}

function renderDashboard(){
  const rows=controlesArray();
  const total=[...state.veiculos.values()].filter(v=>v.situacao==="Ativo").length;
  let pagos=0,pendentes=0,vencidos=0,d30=0,d15=0,d7=0;
  rows.forEach(c=>{
    const st=computeStatus(c.vencimento,c.pagamento);
    if(st==="pago")pagos++;
    else if(st==="vencido")vencidos++;
    else pendentes++;
    if(st!=="pago"&&st!=="vencido"&&c.vencimento){
      const dias=diffDays(c.vencimento,todayISO());
      if(dias<=30)d30++; if(dias<=15)d15++; if(dias<=7)d7++;
    }
  });

/* ============================== TABELA DE VENCIMENTOS ============================== */
function renderTabelas(){
  const anos=[...new Set([...state.tabelas.keys()].map(Number).concat([state.ano,state._tabelaAno]).filter(Boolean))].sort((a,b)=>b-a);
  const activeAno=state._tabelaAno||anos[0]||state.ano;
  const tabela=state.tabelas.get(String(activeAno));
  const regrasMap={};
  (tabela?.regras||[]).forEach(r=>regrasMap[regraKey(r.digito,r.grupo)]=r.data);
  const pad2=n=>String(n).padStart(2,"0");
  const ordemDigitos=["1","2","3","4","5","6","7","8","9","0"];
  return `
    ${connectingBanner()}
    <div class="section-head">
      <h2>Tabela de Vencimentos</h2>
      ${isAdmin()?`<button class="btn btn-primary" data-action="nova-tabela-ano">+ Nova tabela de ano</button>`:""}
    </div>
    <div class="tab-row">
      ${anos.map(a=>`<button class="tab-btn ${a===activeAno?"active":""}" data-action="tabela-ano" data-ano="${a}">${a}</button>`).join("")}
    </div>
    <div class="card card-pad">
      <p class="muted" style="margin:0 0 14px;font-size:12.5px;">Data de vencimento do licenciamento em <b>${activeAno}</b>, por final de placa e faixa das duas últimas casas (padrão do calendário oficial). Ao salvar, os veículos ativos são atualizados automaticamente — controles que já têm data real importada de uma planilha não são sobrescritos.</p>
      <form data-form="tabela-vencimento" data-ano="${activeAno}">
        <div class="table-wrap">
          <table>
            <thead><tr><th>Final de placa</th><th>Faixa</th><th>Data de vencimento</th></tr></thead>
            <tbody>
              ${ordemDigitos.map(d=>TENS_GRUPOS.map((g,gi)=>{
                const key=regraKey(d,g.key);
                const faixa=`${pad2(g.min*10+Number(d))}–${pad2(g.max*10+Number(d))}`;
                return `<tr>
                  ${gi===0?`<td rowspan="3" style="font-weight:700;font-size:15px;vertical-align:middle;">${d}</td>`:""}
                  <td class="mono faint">${faixa}</td>
                  <td><input type="date" name="r_${key}" value="${esc(regrasMap[key]||"")}"></td>
                </tr>`;
              }).join("")).join("")}
            </tbody>
          </table>
        </div>
        ${isAdmin()?`<div class="modal-actions" style="justify-content:flex-start;margin-top:18px;">
          <button class="btn btn-primary" type="submit">Salvar e atualizar controles de ${activeAno}</button>
        </div>`:`<p class="faint" style="margin-top:14px;">Somente administradores podem editar a tabela de vencimentos.</p>`}
      </form>
      ${tabela?`<p class="faint" style="margin-top:10px;">Última atualização: ${formatDateTimeBR(tabela.atualizadoEm)} por ${esc(tabela.atualizadoPor||"–")}</p>`:""}
    </div>`;
}

function acaoLabel(a){
  const map={
    criar_veiculo:"cadastrou o veículo",editar_veiculo:"editou o veículo",excluir_veiculo:"removeu o veículo",
    salvar_tabela:"salvou a tabela de vencimentos",registrar_pagamento:"registrou pagamento",estornar_pagamento:"estornou pagamento",
    anexar_documento:"anexou documento",anexar_comprovante:"anexou comprovante",remover_documento:"removeu documento",remover_comprovante:"removeu comprovante",
    editar_observacao:"editou observação",criar_usuario:"criou usuário",editar_usuario:"editou usuário",

  return map[a]||a;

/* ============================== MODALS ============================== */
function openModal(type,payload){ state.modal={type,payload}; render(); }
function closeModal(){ state.modal=null; render(); }

function paintModal(){
  const root=document.getElementById("modal-root");
  if(!state.modal){ root.innerHTML=""; return; }
  const m=state.modal;
  let html="";
  if(m.type==="veiculo-form") html=modalVeiculoForm(m.payload);
  else if(m.type==="import") html=modalImport(m.payload);
  else if(m.type==="usuario-form") html=modalUsuarioForm(m.payload);
  else if(m.type==="pagamento") html=modalPagamento(m.payload);
  else if(m.type==="detalhe") html=modalDetalhe(m.payload);
  else if(m.type==="anexar") html=modalAnexar(m.payload);
  root.innerHTML=html;
}

/* ============================== BIND: SHELL ============================== */
function bindShell(){
  document.querySelectorAll('[data-action="nav"]').forEach(b=>b.addEventListener("click",()=>{
    if(state.route==="historico" && b.dataset.route!=="historico") unsubscribeAuditoria();
    state.route=b.dataset.route; state.sidebarOpen=false; render();
  }));
  const scrim=document.querySelector('.scrim');
  if(scrim) scrim.addEventListener("click",()=>{state.sidebarOpen=false;render();});
  const ham=document.querySelector('[data-action="toggle-sidebar"]');
  if(ham) ham.addEventListener("click",()=>{state.sidebarOpen=!state.sidebarOpen;render();});
  const logoutBtn=document.querySelector('[data-action="logout"]');
  if(logoutBtn) logoutBtn.addEventListener("click",logout);
  const yearSel=document.querySelector('[data-action="change-ano"]');
  if(yearSel) yearSel.addEventListener("change",()=>{ state.ano=Number(yearSel.value); subscribeControlesAno(state.ano); render(); });

function bindRouteScreen(){
  // Dashboard KPI cards
  document.querySelectorAll('[data-action="dash-nav"]').forEach(el=>{
    const go=()=>{
      if(el.dataset.status!==undefined){
        state.filters={placa:"",frota:"",setor:"",status:el.dataset.status,mes:"",de:"",ate:""};
        if(el.dataset.ateDays){
          const d=new Date(); d.setDate(d.getDate()+Number(el.dataset.ateDays));
          const tz=d.getTimezoneOffset()*60000;
          state.filters.ate=new Date(d-tz).toISOString().slice(0,10);
        }
      }
      state.route=el.dataset.route; state.sidebarOpen=false; render();
    };
    el.addEventListener("click",go);
    el.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } });
  });

  // Frota
  document.querySelectorAll('[data-action="open-veiculo-form"]').forEach(b=>b.addEventListener("click",()=>openModal("veiculo-form",{placa:b.dataset.placa||null})));
  const impBtn=document.querySelector('[data-action="open-import"]'); if(impBtn) impBtn.addEventListener("click",()=>openModal("import",{}));

  // Tabelas
  document.querySelectorAll('[data-action="tabela-ano"]').forEach(b=>b.addEventListener("click",()=>{state._tabelaAno=Number(b.dataset.ano);render();}));
  const novaTab=document.querySelector('[data-action="nova-tabela-ano"]'); if(novaTab) novaTab.addEventListener("click",()=>{
    const anos=[...new Set([...state.tabelas.keys()].map(Number))];
    const proximo=(anos.length?Math.max(...anos):currentYear())+1;
    state._tabelaAno=proximo; render();
  });
  const tabForm=document.querySelector('[data-form="tabela-vencimento"]');
  if(tabForm) tabForm.addEventListener("submit",async e=>{
    e.preventDefault();
    if(!state.db){toast("Sem conexão.",true);return;}
    const ano=tabForm.dataset.ano;
    const fd=new FormData(tabForm);
    const regras=[];
    "0123456789".split("").forEach(d=>TENS_GRUPOS.forEach(g=>{
      regras.push({digito:d,grupo:g.key,data:fd.get("r_"+regraKey(d,g.key))||""});
    }));
    await salvarTabela(ano,regras);
    render();
  });

  // Controle filters
  ["placa","frota","setor","status","mes","de","ate"].forEach(k=>{
    const el=document.getElementById("f-"+k);
    if(!el)return;

    el.addEventListener(evt,debounce(()=>{ state.filters[k]=el.value; render(); },250));
  });
  const clearF=document.querySelector('[data-action="clear-filters"]');
  if(clearF) clearF.addEventListener("click",()=>{ state.filters={placa:"",frota:"",setor:"",status:"",mes:"",de:"",ate:""}; render(); });
  const expCsv=document.querySelector('[data-action="export-csv"]');
  if(expCsv) expCsv.addEventListener("click",exportCsv);

  document.querySelectorAll('[data-action="open-detalhe"]').forEach(b=>b.addEventListener("click",()=>{
    openModal("detalhe",{placa:b.dataset.placa,ano:Number(b.dataset.ano)});
    loadAllYearsForPlaca(b.dataset.placa);
  }));
  document.querySelectorAll('[data-action="quick-pagar"]').forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();openModal("pagamento",{placa:b.dataset.placa,ano:Number(b.dataset.ano)});}));

  // Usuarios
  document.querySelectorAll('[data-action="open-usuario-form"]').forEach(b=>b.addEventListener("click",()=>openModal("usuario-form",{id:b.dataset.id||null})));
}

/* ============================== BIND: MODAL ============================== */
function bindModal(){
  document.querySelectorAll('[data-action="close-modal"]').forEach(b=>b.addEventListener("click",closeModal));
  const scrim=document.querySelector('.modal-scrim');
  if(scrim){
    scrim.addEventListener("click",closeModal);
    const inner=scrim.querySelector('[data-stop]');
    if(inner) inner.addEventListener("click",e=>e.stopPropagation());
  }

  const vf=document.querySelector('[data-form="veiculo"]');
  if(vf) vf.addEventListener("submit",async e=>{
    e.preventDefault();
    if(!state.db){toast("Sem conexão.",true);return;}
    const fd=Object.fromEntries(new FormData(vf).entries());
    const editId=vf.dataset.edit||null;
    const ok=await salvarVeiculo(fd,editId);
    if(ok) closeModal();
  });
  document.querySelectorAll('[data-action="excluir-veiculo"]').forEach(b=>b.addEventListener("click",async()=>{
    if(!confirm("Remover este veículo? Os controles de exercícios já gerados permanecerão no histórico."))return;
    await excluirVeiculo(b.dataset.placa); closeModal();
  }));

  const uf=document.querySelector('[data-form="usuario"]');
  if(uf) uf.addEventListener("submit",async e=>{
    e.preventDefault();
    if(!state.db){toast("Sem conexão.",true);return;}
    const fd=new FormData(uf);
    const editId=uf.dataset.edit||null;
    await salvarUsuario({nome:fd.get("nome"),papel:fd.get("papel"),ativo:fd.get("ativo")==="on"},editId);
    closeModal();
  });

  const pf=document.querySelector('[data-form="pagamento"]');
  if(pf) pf.addEventListener("submit",async e=>{
    e.preventDefault();
    if(!state.db){toast("Sem conexão.",true);return;}
    const fd=Object.fromEntries(new FormData(pf).entries());
    const placa=pf.dataset.placa, ano=Number(pf.dataset.ano);
    await registrarPagamento(placa,ano,fd);
    await refreshDetailCache(placa,ano);
    openModal("detalhe",{placa,ano});
  });
  document.querySelectorAll('[data-action="estornar"]').forEach(b=>b.addEventListener("click",async()=>{
    if(!confirm("Remover o pagamento registrado para este exercício?"))return;
    await estornarPagamento(b.dataset.placa,b.dataset.ano);
    await afterMutationRefresh(b.dataset.placa,Number(b.dataset.ano));
  }));

  document.querySelectorAll('[data-action="open-anexar"]').forEach(b=>b.addEventListener("click",()=>openModal("anexar",{placa:b.dataset.placa,ano:Number(b.dataset.ano),tipo:b.dataset.tipo})));
  document.querySelectorAll('[data-action="remover-anexo"]').forEach(b=>b.addEventListener("click",async()=>{
    if(!confirm("Remover este anexo?"))return;
    await removerAnexo(b.dataset.placa,b.dataset.ano,b.dataset.tipo);
    await afterMutationRefresh(b.dataset.placa,Number(b.dataset.ano));
  }));
  const af=document.querySelector('[data-form="anexar"]');
  if(af) af.addEventListener("submit",async e=>{
    e.preventDefault();
    if(!state.db){toast("Sem conexão.",true);return;}
    const fd=new FormData(af);
    const placa=af.dataset.placa,ano=Number(af.dataset.ano),tipo=af.dataset.tipo;
    const url=fd.get("url");
    const file=fd.get("arquivo");
    try{
      if(url){
        await anexar(placa,ano,tipo,{modo:"link",url:String(url).trim()});
      }else if(file && file.size>0){
        const dataUri=await fileToCompressedDataUri(file);
        await anexar(placa,ano,tipo,{modo:"imagem",dataUri,nomeArquivo:file.name});
      }else{
        toast("Informe um link ou selecione uma imagem.",true); return;
      }
      await refreshDetailCache(placa,ano);
      openModal("detalhe",{placa,ano});
    }catch(err){ toast(err.message||"Falha ao anexar.",true); }
  });

  const of=document.querySelector('[data-form="observacao"]');
  if(of) of.addEventListener("submit",async e=>{
    e.preventDefault();
    if(!state.db){toast("Sem conexão.",true);return;}
    const texto=new FormData(of).get("observacao");
    const placa=of.dataset.placa, ano=Number(of.dataset.ano);
    await salvarObservacao(placa,ano,String(texto||""));
    await afterMutationRefresh(placa,ano);
  });

  bindImport();
}

/* ============================== IMPORT (XLSX) ============================== */
let importedRows=[];
function bindImport(){
  const input=document.getElementById("import-file");
  if(!input)return;
  input.addEventListener("change",()=>{
    const file=input.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const wb=XLSX.read(ev.target.result,{type:"array"});
        const sheet=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(sheet,{defval:""});
        importedRows=mapImportRows(rows);
        renderImportPreview();
      }catch(err){ toast("Não foi possível ler o arquivo.",true); }
    };
    reader.readAsArrayBuffer(file);
  });
}
function findKey(row,candidates){
  const keys=Object.keys(row);
  for(const c of candidates){
    const k=keys.find(k2=>k2.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")===c);
    if(k)return k;
  }
  return null;
}
function mapImportRows(rows){
  return rows.map(r=>{
    const kFrota=findKey(r,["frota"]);
    const kPlaca=findKey(r,["placa"]);
    const kDesc=findKey(r,["descricao","descricao do veiculo","veiculo"]);
    const kMarca=findKey(r,["marca/modelo","marca","modelo"]);
    const kSetor=findKey(r,["setor"]);
    const kCC=findKey(r,["centro de custo","centro custo","cc"]);
    const kResp=findKey(r,["responsavel"]);
    const kSit=findKey(r,["situacao","status"]);
    const placa=normalizePlaca(kPlaca?r[kPlaca]:"");
    return {
      frota:kFrota?String(r[kFrota]).trim():"",
      placa,
      descricao:kDesc?String(r[kDesc]).trim():"",
      marcaModelo:kMarca?String(r[kMarca]).trim():"",
      setor:kSetor?String(r[kSetor]).trim():"",
      centroCusto:kCC?String(r[kCC]).trim():"",
      responsavel:kResp?String(r[kResp]).trim():"",
      situacao:kSit&&String(r[kSit]).trim().toLowerCase().startsWith("inativ")?"Inativo":"Ativo",
      valido:!!placa,
    };
  });
}
function renderImportPreview(){
  const el=document.getElementById("import-preview");
  const validos=importedRows.filter(r=>r.valido).length;
  const invalidos=importedRows.length-validos;
  el.innerHTML=`
    <p class="faint">${importedRows.length} linha(s) lida(s) — ${validos} válida(s)${invalidos?`, ${invalidos} sem placa (serão ignoradas)`:""}.</p>
    <div class="table-wrap" style="max-height:260px;overflow-y:auto;">
      <table><thead><tr><th>Frota</th><th>Placa</th><th>Descrição</th><th>Setor</th><th>C.Custo</th></tr></thead>
      <tbody>${importedRows.slice(0,50).map(r=>`<tr ${r.valido?"":'style="opacity:.4"'}><td>${esc(r.frota)}</td><td class="mono">${esc(r.placa)}</td><td>${esc(r.descricao)}</td><td>${esc(r.setor)}</td><td>${esc(r.centroCusto)}</td></tr>`).join("")}</tbody></table>
    </div>`;
  const confirmBtn=document.getElementById("import-confirm");
  if(confirmBtn) confirmBtn.disabled=validos===0;
}
document.addEventListener("click",async e=>{
  const b=e.target.closest('[data-action="confirm-import"]');
  if(!b)return;
  if(!state.db){toast("Sem conexão.",true);return;}
  if(!isAdmin()){toast("Apenas administradores podem importar a frota.",true);return;}
  const validos=importedRows.filter(r=>r.valido);
  b.disabled=true; b.textContent="Importando…";
  let count=0;
  for(const r of validos){
    const existing=state.veiculos.get(r.placa);
    const body={
      frota:r.frota,placa:r.placa,descricao:r.descricao,marcaModelo:r.marcaModelo,
      anoFabricacao:existing?.anoFabricacao||"",setor:r.setor,centroCusto:r.centroCusto,
      responsavel:r.responsavel,situacao:r.situacao,
      licenciamentoAtivo:existing?.licenciamentoAtivo!==false,
      criadoEm:existing?.criadoEm||nowISO(),atualizadoEm:nowISO(),
    };
    await state.db.doc("veiculos/"+r.placa).set(body);
    state.veiculos.set(r.placa,body);
    if(body.situacao==="Ativo") await gerarControlesParaVeiculo(body);
    count++;
  }
  await logAuditoria("importar_frota","veiculo",null,{quantidade:count});
  toast(`${count} veículo(s) importado(s).`);
  importedRows=[];
  closeModal();
});

/* ============================== CSV EXPORT ============================== */
async function exportCsv(){
  const rows=controlesArray().map(joined).filter(matchesFilters).sort((a,b)=>(a.vencimento||"").localeCompare(b.vencimento||""));
  const header=["Frota","Placa","Veiculo","Ano","Vencimento","Dias","Situacao","DataPagamento","ValorPago","Observacao"];
  const lines=[header.join(";")];
  rows.forEach(c=>{
    const st=computeStatus(c.vencimento,c.pagamento);
    lines.push([c.frota,c.placa,c.veiculo.descricao||"",c.ano,formatDateBR(c.vencimento),diasLabel(c.vencimento,st),STATUS_META[st].label,c.pagamento?formatDateBR(c.pagamento.data):"",c.pagamento&&c.pagamento.valor!=null?c.pagamento.valor:"",(c.observacao||"").replace(/;/g,",")].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";"));
  });
  const csv="﻿"+lines.join("\r\n");
  const filename=`controle_frota_${state.ano}.csv`;
  try{
    const downloads=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
    if(downloads){ await downloads.save({filename,data:csv}); return; }
  }catch(e){}
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); a.remove();
}
